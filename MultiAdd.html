<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乘加分配律圖解學習網</title>
  <style>
    :root {
      --primary: #4A90E2;
      --color-a: #8E44AD; /* 高度 - 紫色 */
      --color-b: #2980B9; /* 方陣 B - 藍色 */
      --color-c: #C0392B; /* 方陣 C - 紅色 */
      --bg-light: #F4F7F9;
      --card-bg: #FFFFFF;
      --text-dark: #2C3E50;
    }

    * { box-sizing: border-box; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; user-select: none; }
    body { margin: 0; padding: 15px; background-color: var(--bg-light); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { text-align: center; margin-bottom: 10px; }
    h1 { margin: 0 0 8px 0; font-size: 1.6rem; color: #1A365D; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { padding: 8px 20px; font-size: 1rem; font-weight: bold; border: 2px solid var(--primary); background: white; color: var(--primary); border-radius: 20px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; }

    .main-container { width: 100%; max-width: 950px; background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; }

    .controls-panel { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; background: #EBF8FF; padding: 15px; border-radius: 12px; width: 100%; margin-bottom: 15px; }
    .select-group { display: flex; align-items: center; gap: 6px; font-size: 1.1rem; font-weight: bold; }
    select { padding: 6px 12px; font-size: 1.1rem; border-radius: 8px; border: 2px solid #CBD5E0; background: white; font-weight: bold; cursor: pointer; }
    .select-a select { border-color: var(--color-a); color: var(--color-a); }
    .select-b select { border-color: var(--color-b); color: var(--color-b); }
    .select-c select { border-color: var(--color-c); color: var(--color-c); }

    .action-btn { padding: 10px 20px; font-size: 1.05rem; font-weight: bold; color: white; background: #319795; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s, background 0.2s; }
    .action-btn:hover { background: #2B6CB0; }
    .action-btn:active { transform: scale(0.96); }

    .drag-hint { font-size: 0.95rem; color: #E53E3E; font-weight: bold; margin-bottom: 10px; text-align: center; background: #FFF5F5; padding: 8px 18px; border-radius: 20px; border: 1px solid #FEB2B2; }

    .formula-display { font-size: 1.35rem; font-weight: bold; margin-bottom: 15px; text-align: center; padding: 10px 20px; background: #F7FAFC; border-radius: 10px; border: 1px solid #E2E8F0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 60px; }
    .num-a { color: var(--color-a); font-size: 1.15em; }
    .num-b { color: var(--color-b); font-size: 1.15em; }
    .num-c { color: var(--color-c); font-size: 1.15em; }

    .stage { width: 100%; height: 400px; background: #FAFAFA; border: 2px dashed #CBD5E0; border-radius: 12px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    .grid-matrix { display: grid; gap: 2px; position: absolute; }
    .grid-matrix.animated { transition: left 5s cubic-bezier(0.25, 1, 0.5, 1), opacity 2s ease; }
    
    .cell { border-radius: 3px; display: flex; justify-content: center; align-items: center; color: white; font-size: 10px; font-weight: bold; }
    .cell-b { background: var(--color-b); }
    .cell-c { background: var(--color-c); cursor: grab; }
    .cell-c:active { cursor: grabbing; }

    .axis-label-row { position: absolute; display: flex; gap: 2px; pointer-events: none; }
    .axis-label-row.animated { transition: left 5s cubic-bezier(0.25, 1, 0.5, 1); }
    .axis-label-col { position: absolute; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
    .label-cell { display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #718096; }

    .quiz-container { width: 100%; display: none; flex-direction: column; align-items: center; }
    .score-board { display: flex; justify-content: space-between; width: 100%; background: #FEFCBF; padding: 10px 20px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; color: #744210; }
    .question-card { background: #EDF2F7; padding: 20px; border-radius: 12px; width: 100%; text-align: center; margin-bottom: 20px; }
    .question-text { font-size: 1.3rem; margin-bottom: 15px; font-weight: bold; }
    .quiz-input-group { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: bold; flex-wrap: wrap; }
    .quiz-input { width: 60px; height: 45px; font-size: 1.3rem; text-align: center; border: 2px solid var(--primary); border-radius: 8px; font-weight: bold; }

    #canvas-fx { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99; }
  </style>
</head>
<body>

  <canvas id="canvas-fx"></canvas>

  <header>
    <h1>➕ 乘加分配律圖解學習網 🧩</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchMainTab('explore')">💡 自由動手做</button>
      <button class="tab-btn" onclick="switchMainTab('quiz')">🎮 小試身手</button>
    </div>
  </header>

  <div class="main-container">
    
    <div id="explore-mode" style="width: 100%;">
      
      <div class="controls-panel">
        <div class="select-group select-a">
          <label>直的高 (a):</label>
          <select id="select-a" onchange="updateExplore()"></select>
        </div>
        <div class="select-group select-b">
          <label>藍色橫長 (b):</label>
          <select id="select-b" onchange="updateExplore()"></select>
        </div>
        <div class="select-group select-c">
          <label>紅色橫長 (c):</label>
          <select id="select-c" onchange="updateExplore()"></select>
        </div>
        <button class="action-btn" onclick="playAutoAnimation()">🎬 看看它是怎麼合併的</button>
      </div>

      <div class="drag-hint">🖐️ 小提示：用手指或滑鼠拿拿看「紅色方塊」，把它拉近和藍色拼在一起喔！</div>

      <div class="formula-display" id="formula-text"></div>

      <div class="stage" id="stage"></div>
    </div>

    <div id="quiz-mode" class="quiz-container">
      <div class="score-board">
        <span>🏆 得分：<span id="score">0</span></span>
        <span>🔥 連勝：<span id="streak">0</span></span>
      </div>

      <div class="question-card">
        <div class="question-text">✍️ 動動腦，把空格裡的正確數字填上去吧：</div>
        <div class="quiz-input-group" id="quiz-content"></div>
      </div>

      <button class="action-btn" style="margin-top: 15px;" onclick="checkQuizAnswer()">檢查答案</button>
    </div>

  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'pop') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    let isDragging = false;
    let startX = 0;
    let initialLeft = 0;

    function initSelects() {
      ['select-a', 'select-b', 'select-c'].forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = i;
          select.appendChild(opt);
        }
      });
      document.getElementById('select-a').value = 4;
      document.getElementById('select-b').value = 8;
      document.getElementById('select-c').value = 3;
    }

    function updateFormulaDisplay(isConnected) {
      let a = parseInt(document.getElementById('select-a').value);
      let b = parseInt(document.getElementById('select-b').value);
      let c = parseInt(document.getElementById('select-c').value);

      if (isConnected) {
        document.getElementById('formula-text').innerHTML = `
          <span><span class="num-a">${a}</span> × <span class="num-b">${b}</span> + <span class="num-a">${a}</span> × <span class="num-c">${c}</span></span>
          <span>=</span>
          <span><span class="num-a">${a}</span> × (<span class="num-b">${b}</span> + <span class="num-c">${c}</span>)</span>
          <span>=</span>
          <span><span class="num-a">${a}</span> × <span style="color:#27AE60">${b + c}</span></span>
          <span>=</span>
          <span style="color:#2B6CB0">${a * (b + c)}</span>
        `;
      } else {
        document.getElementById('formula-text').innerHTML = `
          <span><span class="num-a">${a}</span> × <span class="num-b">${b}</span> + <span class="num-a">${a}</span> × <span class="num-c">${c}</span></span>
          <span>=</span>
          <span style="color:#2B6CB0">${a * (b + c)}</span>
        `;
      }
    }

    function updateExplore() {
      let a = parseInt(document.getElementById('select-a').value);
      let b = parseInt(document.getElementById('select-b').value);
      let c = parseInt(document.getElementById('select-c').value);

      updateFormulaDisplay(false);
      renderStage('stage', a, b, c, false);
    }

    function renderStage(stageId, a, b, c, isAnimated = false) {
      const stage = document.getElementById(stageId);
      stage.innerHTML = '';

      const totalW = b + c + 4;
      const maxH = a + 3;

      const stageW = stage.clientWidth || 600;
      const stageH = stage.clientHeight || 380;
      const cellSize = Math.min(Math.floor((stageW - 80) / totalW), Math.floor((stageH - 80) / maxH), 26);

      const offsetLeft = 25;
      const offsetBottom = 22;

      const container = document.createElement('div');
      container.style.position = 'relative';
      container.style.width = `${(b + c + 2) * (cellSize + 2) + offsetLeft}px`;
      container.style.height = `${a * (cellSize + 2) + offsetBottom}px`;

      const axisY = document.createElement('div');
      axisY.className = 'axis-label-col';
      axisY.style.left = '0px';
      axisY.style.top = '0px';
      for (let i = 1; i <= a; i++) {
        const lbl = document.createElement('div');
        lbl.className = 'label-cell';
        lbl.style.width = `${offsetLeft - 4}px`;
        lbl.style.height = `${cellSize}px`;
        lbl.textContent = i;
        lbl.style.color = 'var(--color-a)';
        axisY.appendChild(lbl);
      }
      container.appendChild(axisY);

      const matB = createMatrix(a, b, cellSize, 'cell-b');
      matB.style.left = `${offsetLeft}px`;

      const axisX_B = createAxisX(1, b, cellSize, 'var(--color-b)');
      axisX_B.style.left = `${offsetLeft}px`;
      axisX_B.style.top = `${a * (cellSize + 2) + 2}px`;
      container.appendChild(axisX_B);

      const matC = createMatrix(a, c, cellSize, 'cell-c');
      matC.id = stageId + '-matC';
      const sep = isAnimated ? 0 : (2 * (cellSize + 2));
      matC.style.left = `${offsetLeft + (b * (cellSize + 2)) + sep}px`;

      const axisX_C = createAxisX(isAnimated ? (b + 1) : 1, c, cellSize, 'var(--color-c)');
      axisX_C.id = stageId + '-axisC';
      axisX_C.style.left = `${offsetLeft + (b * (cellSize + 2)) + sep}px`;
      axisX_C.style.top = `${a * (cellSize + 2) + 2}px`;

      if (isAnimated) {
        matC.classList.add('animated');
        axisX_C.classList.add('animated');
        updateFormulaDisplay(true);
      } else {
        updateFormulaDisplay(false);
      }

      container.appendChild(matB);
      container.appendChild(matC);
      container.appendChild(axisX_C);

      makeDraggable(matC, axisX_C, offsetLeft, b, c, cellSize);

      stage.appendChild(container);
    }

    function makeDraggable(mat, axis, offsetLeft, baseW, c, size) {
      const minLeft = offsetLeft + baseW * (size + 2);
      const maxLeft = minLeft + 2 * (size + 2);

      const updateState = (currentL) => {
        const isConnected = Math.abs(currentL - minLeft) < (size * 0.8);
        const startNum = isConnected ? (baseW + 1) : 1;

        axis.innerHTML = '';
        for (let i = 0; i < c; i++) {
          const lbl = document.createElement('div');
          lbl.className = 'label-cell';
          lbl.style.width = `${size}px`;
          lbl.style.height = '18px';
          lbl.textContent = startNum + i;
          lbl.style.color = 'var(--color-c)';
          axis.appendChild(lbl);
        }

        updateFormulaDisplay(isConnected);
      };

      const onStart = (e) => {
        isDragging = true;
        mat.classList.remove('animated');
        axis.classList.remove('animated');
        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        startX = pageX;
        initialLeft = parseFloat(mat.style.left);
        playSound('pop');
      };

      const onMove = (e) => {
        if (!isDragging) return;
        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        const deltaX = pageX - startX;
        let newLeft = Math.max(minLeft, Math.min(initialLeft + deltaX, maxLeft));

        mat.style.left = `${newLeft}px`;
        axis.style.left = `${newLeft}px`;
        updateState(newLeft);
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        let currentL = parseFloat(mat.style.left);

        mat.classList.add('animated');
        axis.classList.add('animated');

        if (Math.abs(currentL - minLeft) < (size * 1.2)) {
          mat.style.left = `${minLeft}px`;
          axis.style.left = `${minLeft}px`;
          updateState(minLeft);
        } else {
          mat.style.left = `${maxLeft}px`;
          axis.style.left = `${maxLeft}px`;
          updateState(maxLeft);
        }
      };

      mat.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
      mat.addEventListener('touchstart', onStart, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onEnd);
    }

    function createAxisX(startVal, count, cellSize, color) {
      const axis = document.createElement('div');
      axis.className = 'axis-label-row';
      for (let i = 0; i < count; i++) {
        const lbl = document.createElement('div');
        lbl.className = 'label-cell';
        lbl.style.width = `${cellSize}px`;
        lbl.style.height = '18px';
        lbl.textContent = startVal + i;
        lbl.style.color = color;
        axis.appendChild(lbl);
      }
      return axis;
    }

    function createMatrix(rows, cols, size, cellClass) {
      const mat = document.createElement('div');
      mat.className = 'grid-matrix';
      mat.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
      for (let i = 0; i < rows * cols; i++) {
        const cell = document.createElement('div');
        cell.className = `cell ${cellClass}`;
        cell.style.width = `${size}px`;
        cell.style.height = `${size}px`;
        mat.appendChild(cell);
      }
      return mat;
    }

    function playAutoAnimation() {
      const a = parseInt(document.getElementById('select-a').value);
      const b = parseInt(document.getElementById('select-b').value);
      const c = parseInt(document.getElementById('select-c').value);

      renderStage('stage', a, b, c, false);
      playSound('pop');
      setTimeout(() => { renderStage('stage', a, b, c, true); }, 50);
    }

    function switchMainTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'explore') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('explore-mode').style.display = 'block';
        document.getElementById('quiz-mode').style.display = 'none';
        updateExplore();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('explore-mode').style.display = 'none';
        document.getElementById('quiz-mode').style.display = 'flex';
        nextQuestion();
      }
    }

    let currentQuiz = {};
    let score = 0;
    let streak = 0;

    function generateQuestion() {
      const a = Math.floor(Math.random() * 7) + 3;
      let b = Math.floor(Math.random() * 8) + 3;
      let c = Math.floor(Math.random() * 8) + 2;
      const blankPos = Math.floor(Math.random() * 3);

      return {
        a, b, c, blankPos,
        ans: blankPos === 0 ? a : (blankPos === 1 ? b : c)
      };
    }

    function nextQuestion() {
      currentQuiz = generateQuestion();
      const { a, b, c, blankPos } = currentQuiz;
      document.getElementById('quiz-content').innerHTML = `
        <span class="num-a">${blankPos === 0 ? '<input class="quiz-input" id="ans-input" type="number">' : a}</span> × 
        <span class="num-b">${blankPos === 1 ? '<input class="quiz-input" id="ans-input" type="number">' : b}</span> + 
        <span class="num-a">${a}</span> × 
        <span class="num-c">${blankPos === 2 ? '<input class="quiz-input" id="ans-input" type="number">' : c}</span> 
        = <span class="num-a">${a}</span> × (<span class="num-b">${b}</span> + <span class="num-c">${c}</span>)
      `;
    }

    function checkQuizAnswer() {
      const input = document.getElementById('ans-input');
      if (!input || !input.value) return;
      if (parseInt(input.value) === currentQuiz.ans) {
        playSound('win');
        score += 10; streak += 1;
        document.getElementById('score').textContent = score;
        document.getElementById('streak').textContent = streak;
        alert('🎉 答對了！你太棒了！');
        nextQuestion();
      } else {
        streak = 0;
        document.getElementById('streak').textContent = streak;
        alert('❌ 算算看，再試一次喔！');
      }
    }

    initSelects();
    updateExplore();
  </script>
</body>
</html>
